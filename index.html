<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DUENDES — Choirs & Community</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f1e8;
    color: #29251f;
    text-align: center;
}

header {
    padding: 50px 20px 30px;
}

h1 {
    font-size: 48px;
    margin: 0;
    letter-spacing: 6px;
}

.subtitle {
    font-size: 18px;
    margin-top: 10px;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 20px;
}

.choir {
    margin: 30px 0;
}

.choir h2 {
    font-size: 25px;
}

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-top: 20px;
}

button {
    padding: 18px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    cursor: pointer;
    background: white;
    color: #29251f;
}

button:hover {
    transform: translateY(-2px);
}

footer {
    padding: 40px 20px;
    font-size: 14px;
}
</style>
</head>

<body>

<header>
    <h1>DUENDES</h1>
    <div class="subtitle">Choirs • Music • Community</div>
</header>

<div class="container">

    <div class="choir">
        <h2>🇪🇸 DUENDES ESPAÑOL</h2>

        <div class="buttons">
            <button>🎵 Music</button>
            <button>📖 Lyrics</button>
            <button>🎼 Scores</button>
            <button>🎧 Practice</button>
            <button>📅 Rehearsals</button>
            <button>🇪🇸 Spanish</button>
        </div>
    </div>

    <div class="choir">
        <h2>🇬🇧 DUENDES ENGLISH</h2>

        <div class="buttons">
            <button>🎵 Music</button>
            <button>📖 Lyrics</button>
            <button>🎼 Scores</button>
            <button>🎧 Practice</button>
            <button>📅 Rehearsals</button>
            <button>💬 Community</button>
        </div>
    </div>

</div>

<footer>
    🍻 Social &nbsp; • &nbsp; 💛 Support Duendes
</footer>

</body>
</html>
